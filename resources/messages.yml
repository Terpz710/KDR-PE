use-command=ingame: "Run this command in-game"
player-not-found: "Player doesn't exist!"
invalid-type: "Type '{type}' is invalid!"

stats-title: "-= {player} stats =-"
stats-body-kills: "Kills: {kills}"
stats-body-killstreak: "Killstreak: {killstreak}"
stats-body-deaths: "Deaths: {deaths}"
stats-body-kdr: "KDR: {kdr}"

stats-title-other: "-= {player} stats =-"
stats-body-kills-other: "Kills: {kills}"
stats-body-killstreak-other: "Killstreak: {killstreak}"
stats-body-deaths-other: "Deaths: {deaths}"
stats-body-kdr-other: "KDR: {kdr}"

